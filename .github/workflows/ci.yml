name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check
      - name: Compile
        run: python -m compileall -q arena_farmer.py arena_health.py arena_supervisor.py arena_optimizer.py arena_version_monitor.py
      - name: Test
        run: python -m unittest discover -v
      - name: Validate CLI entry points
        run: |
          arena-hero-agent --help
          arena-hero-supervisor --help
          arena-hero-optimizer --help
          arena-hero-version-monitor --help
          arena-hero-health --help

  windows-surface:
    name: Windows public surface
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements.lock
      - name: Scan tracked files for credentials
        run: python scripts/check_secrets.py
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem start_agent.ps1, scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors) { throw ($errors | Out-String) }
          }
