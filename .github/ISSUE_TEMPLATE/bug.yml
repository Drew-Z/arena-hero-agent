name: Bug report
description: Report reproducible tactic, runtime, or deployment behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, model credentials, player IDs, or unredacted production logs.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and at which Tick or deployment stage?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent version or commit
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Run `python --version`, or enter unknown.
    validations:
      required: true
  - type: input
    id: contract_version
    attributes:
      label: Arena Hero API and gameplay contract
      description: For example, API v0.1 / gameplay v0.13, or unknown.
    validations:
      required: true
  - type: input
    id: sdk_version
    attributes:
      label: Arena Hero Python SDK version
      description: Run `python -c "import arena_hero; print(arena_hero.__version__)"`, or enter unknown.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Windows local
        - Linux/macOS local
        - Docker Compose
        - Linux systemd
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Provide minimal redacted diagnostics or reproduction steps.
  - type: checkboxes
    id: safety
    attributes:
      label: Secret check
      options:
        - label: I removed credentials, player identifiers, hostnames, IP addresses, and private logs.
          required: true
