services:
  agent:
    build:
      context: .
    image: "${ARENA_HERO_AGENT_IMAGE:-arena-hero-agent:local}"
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - arena-history:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ARENA_HERO_API_KEY_FILE: /run/secrets/arena_hero_api_key
    healthcheck:
      test:
        - CMD
        - arena-hero-health
        - --heartbeat-only
        - --heartbeat-file
        - /tmp/arena-hero-heartbeat.json
        - --max-heartbeat-age-seconds
        - "180"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    secrets:
      - arena_hero_api_key
    command:
      - arena-hero-agent
      - --worker-target
      - "${ARENA_WORKER_TARGET:-18}"
      - --beacon-policy
      - "${ARENA_BEACON_POLICY:-pursue}"
      - --history-db
      - /data/history.sqlite3
      - --no-compatibility-marker
      - --heartbeat-file
      - /tmp/arena-hero-heartbeat.json
      - --stale-turn-timeout-seconds
      - "150"

  dashboard:
    build:
      context: .
    image: "${ARENA_HERO_AGENT_IMAGE:-arena-hero-agent:local}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${ARENA_DASHBOARD_PORT:-8765}:8765"
    volumes:
      - arena-history:/data:ro
    command:
      - arena-hero-dashboard
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --history-db
      - /data/history.sqlite3

secrets:
  arena_hero_api_key:
    file: "${ARENA_HERO_API_KEY_SECRET_FILE:-./secrets/arena_hero_api_key.txt}"

volumes:
  arena-history:
