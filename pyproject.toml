[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-hero-agent"
version = "0.1.0"
description = "A deterministic aggressive-expansion Arena Hero agent with tactical history dashboard."
readme = "README.md"
authors = [{ name = "WuDiWangWaSai" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "arena-hero==0.2.9",
    "httpx==0.28.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://github.com/WuDiWangWaSai/arena-hero-agent"
Documentation = "https://github.com/WuDiWangWaSai/arena-hero-agent#readme"
Issues = "https://github.com/WuDiWangWaSai/arena-hero-agent/issues"
Source = "https://github.com/WuDiWangWaSai/arena-hero-agent"

[project.scripts]
arena-hero-agent = "arena_farmer:main"
arena-hero-dashboard = "arena_dashboard:main"
arena-hero-supervisor = "arena_supervisor:main"
arena-hero-optimizer = "arena_optimizer:main"
arena-hero-version-monitor = "arena_version_monitor:main"
arena-hero-health = "arena_health:main"

[tool.setuptools]
py-modules = [
    "arena_farmer",
    "arena_dashboard",
    "arena_history",
    "arena_optimizer",
    "arena_supervisor",
    "arena_version_monitor",
    "arena_health",
]
packages = ["dashboard"]

[tool.setuptools.package-data]
dashboard = ["*.html", "*.css", "*.js"]
