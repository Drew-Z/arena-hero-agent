<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Hero 战术地图</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Arena Hero 战术地图</div>
    <div class="metrics" aria-live="polite">
      <span>Tick <strong id="metric-tick">--</strong></span>
      <span>资源 <strong id="metric-resources">--/--</strong></span>
      <span>人口 <strong id="metric-population">--</strong></span>
      <span>兵力 <strong id="metric-force">--</strong></span>
      <span>态势 <strong id="metric-posture">--</strong></span>
      <span>敌情 <strong id="metric-enemies">--</strong></span>
    </div>
    <nav class="controls" aria-label="历史回放控制">
      <button id="previous-tick" class="icon-button" title="上一个 Tick" aria-label="上一个 Tick">‹</button>
      <button id="toggle-play" class="icon-button" title="播放历史" aria-label="播放历史">▶</button>
      <input id="tick-slider" type="range" min="0" max="0" value="0" aria-label="选择 Tick">
      <button id="live-tick" class="mode-button active" title="返回实时">实时</button>
      <button id="next-tick" class="icon-button" title="下一个 Tick" aria-label="下一个 Tick">›</button>
      <button id="zoom-out" class="icon-button" title="缩小" aria-label="缩小">−</button>
      <button id="zoom-in" class="icon-button" title="放大" aria-label="放大">+</button>
      <button id="center-map" class="icon-button" title="定位己方 Core" aria-label="定位己方 Core">⌖</button>
    </nav>
  </header>

  <main class="workspace">
    <section class="map-region" aria-label="战术地图">
      <canvas id="map" tabindex="0"></canvas>
      <div class="map-toolbar">
        <button id="fit-map" type="button">适配全图</button>
        <button id="home-map" type="button">回到 Core</button>
        <label><input type="checkbox" data-map-layer="explored" checked> 已探索</label>
        <label><input type="checkbox" data-map-layer="obstacles" checked> 障碍</label>
        <label><input type="checkbox" data-map-layer="resources" checked> 资源</label>
        <label><input type="checkbox" data-map-layer="history" checked> 历史</label>
        <label><input type="checkbox" data-map-layer="routes"> 路线</label>
      </div>
      <div class="legend" aria-label="地图图例">
        <span><i class="swatch explored"></i>已探索</span>
        <span><i class="swatch obstacle"></i>障碍</span>
        <span><i class="swatch resource"></i>当前资源</span>
        <span><i class="swatch resource-history"></i>历史资源</span>
        <span><i class="swatch friendly"></i>己方</span>
        <span><i class="swatch ally"></i>盟友</span>
        <span><i class="swatch enemy"></i>敌方</span>
        <span><i class="swatch old-core"></i>历史 Core</span>
        <span><i class="swatch beacon"></i>冠军信标</span>
      </div>
      <div id="map-status" class="map-status">等待历史数据</div>
      <div id="cursor-position" class="cursor-position">x -- · y --</div>
    </section>

    <aside class="intel-panel">
      <div class="panel-tabs" role="tablist" aria-label="情报视图">
        <button id="events-tab" class="panel-tab active" role="tab" aria-selected="true">事件</button>
        <button id="ranking-tab" class="panel-tab" role="tab" aria-selected="false">排行榜</button>
        <button id="control-tab" class="panel-tab" role="tab" aria-selected="false">调兵</button>
      </div>
      <section id="events-panel" class="panel-view" role="tabpanel">
        <ol id="event-list" class="event-list"></ol>
      </section>
      <section id="ranking-panel" class="panel-view hidden" role="tabpanel">
        <div class="ranking-modes" role="tablist" aria-label="排行榜类型">
          <button data-ranking="damage_dealt" class="ranking-mode active">伤害</button>
          <button data-ranking="core_destruction_participations" class="ranking-mode">Core</button>
          <button data-ranking="beacon_ticks_held" class="ranking-mode">信标</button>
        </div>
        <ol id="ranking-list" class="ranking-list"></ol>
      </section>
      <section id="control-panel" class="panel-view hidden" role="tabpanel">
        <form id="production-form" class="config-form">
          <h3>生产比例</h3>
          <label>Worker <input id="production-worker" type="number" min="0" max="100" value="4" required></label>
          <label>Vanguard <input id="production-vanguard" type="number" min="0" max="100" value="1" required></label>
          <label>Ranger <input id="production-ranger" type="number" min="0" max="100" value="1" required></label>
          <button type="submit">保存生产配置</button>
          <p id="production-status" class="form-status" aria-live="polite"></p>
        </form>
        <form id="expedition-form" class="config-form">
          <h3>远征队</h3>
          <input id="expedition-id" type="hidden">
          <label class="wide">名称 <input id="expedition-name" maxlength="40" value="远征队 1" required></label>
          <label>Ranger <input id="expedition-ranger" type="number" min="0" max="32" value="2" required></label>
          <label>Vanguard <input id="expedition-vanguard" type="number" min="0" max="32" value="2" required></label>
          <label>X <input id="expedition-x" type="number" step="1" value="0" required></label>
          <label>Y <input id="expedition-y" type="number" step="1" value="0" required></label>
          <label class="checkbox-label"><input id="expedition-enabled" type="checkbox" checked> 启用</label>
          <button id="pick-expedition-target" class="secondary-button" type="button">在地图上选择目标</button>
          <button type="submit">保存远征队</button>
          <p id="expedition-status" class="form-status" aria-live="polite"></p>
        </form>
        <ol id="expedition-list" class="event-list"></ol>
        <form id="order-form" class="order-form">
          <label>兵种
            <select id="order-unit-type">
              <option value="CORE">核心</option>
              <option value="WORKER">工兵</option>
              <option value="VANGUARD">先锋</option>
              <option value="RANGER">游侠</option>
            </select>
          </label>
          <fieldset class="unit-picker-field">
            <legend>选择具体核心或单位</legend>
            <div id="order-unit-list" class="unit-picker"></div>
          </fieldset>
          <label>数量
            <input id="order-count" type="number" min="1" max="64" value="0" readonly>
          </label>
          <label>X 坐标
            <input id="order-x" type="number" step="1" value="-445" required>
          </label>
          <label>Y 坐标
            <input id="order-y" type="number" step="1" value="547" required>
          </label>
          <button id="pick-order-target" class="target-picker-button" type="button">在地图上选择目标</button>
          <button type="submit">派遣</button>
          <p id="order-status" class="form-status" aria-live="polite"></p>
        </form>
        <form id="alliance-form" class="config-form">
          <h3>联盟靠拢</h3>
          <label class="wide">与盟主保持距离（格）
            <input id="alliance-rally-radius" type="number" min="1" max="256" value="12" required>
          </label>
          <button type="submit">保存靠拢距离</button>
          <p id="alliance-status" class="form-status" aria-live="polite"></p>
        </form>
        <div class="control-section">
          <h3 id="kill-heading">我的战果</h3>
          <div id="kill-stats" class="kill-stats"></div>
          <ol id="kill-list" class="event-list"></ol>
        </div>
        <div class="control-section">
          <h3>谁打了我</h3>
          <ol id="loss-list" class="event-list"></ol>
        </div>
        <div class="control-section">
          <h3>复仇名单</h3>
          <ol id="revenge-list" class="event-list"></ol>
        </div>
        <div class="control-section">
          <h3>调兵记录</h3>
          <ol id="order-list" class="event-list"></ol>
        </div>
      </section>
    </aside>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
